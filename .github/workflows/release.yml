name: Release

# 发布流程（见 docs/RELEASING.md）：
#   ./gradlew shadowJar 每个平台只内含当前 OS 的 Playwright 驱动（~43MB），
#   所以公共发布必须按平台分别构建 4 个 jar，而不是出一个通用大 jar。
#
# 触发方式：
#   - push tag v*      → 矩阵构建 4 个平台 jar，并创建 GitHub Release（附件 4 个 jar）
#   - workflow_dispatch → 只做矩阵构建自测，不创建 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: shadowJar (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # NOTE: runner 标签已按 actions/runner-images 的当前清单校正 ——
          # docs/RELEASING.md 里写的 macos-13 已被 GitHub 退役，macos-14 也已 deprecated。
          # arm64 = macos-15（macos-15-xlarge 为付费大机型）；x64 = macos-15-intel。
          - os: macos-15
            platform: mac-arm64
          # 若 macos-15-intel 在某天不可用，删掉此条即出 3 平台制品（见 RELEASING.md 的取舍表）。
          - os: macos-15-intel
            platform: mac-x64
          - os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Unix 走 ./gradlew；Windows 必须走 gradlew.bat —— sh 版 wrapper 在 Windows 上
      # 既有 CRLF shebang 问题，又有 MSYS 把 POSIX 路径递给 java.exe 的坑。
      # .gitattributes 已保证 gradlew 检出为 LF、gradlew.bat 检出为 CRLF。
      - name: Build fat jar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./gradlew --no-daemon --console=plain shadowJar

      - name: Build fat jar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\gradlew.bat --no-daemon --console=plain shadowJar 2>&1 | Tee-Object -FilePath gradle-win.log
          exit $LASTEXITCODE

      # 把 Windows 构建失败的最后 40 行塞进一个 annotation：job 日志需要 admin 权限
      # 才能下载，而 annotation 是公开可读的，方便在没有 token 的环境里定位问题。
      - name: Surface Windows build failure as annotation
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path gradle-win.log) {
            $tail = (Get-Content gradle-win.log -Tail 40) -join "%0A"
            Write-Output "::error title=Windows shadowJar failure::$tail"
          } else {
            Write-Output "::error title=Windows shadowJar failure::gradle-win.log was not created"
          }

      - name: Rename jar with platform suffix
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls dist/*.jar | head -n 1)
          base=$(basename "$jar" .jar)
          mv "$jar" "dist/${base}-${{ matrix.platform }}.jar"
          ls -la dist/

      - name: Upload platform jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.platform }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"   # v1.1.0 -> 1.1.0 / v1.1 -> 1.1
          short="$version"                 # CHANGELOG 版本段是 X.Y，去掉补丁号
          case "$version" in *.*.*) short="${version%.*}" ;; esac
          awk -v hdr="## [${short}]" '
            index($0, hdr) == 1 { f = 1; print; next }
            f && index($0, "## [") == 1 { exit }
            f { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            echo "API Sentinel ${GITHUB_REF_NAME}" > notes.md
          fi
          echo "--- notes.md ---"; cat notes.md

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist/
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.jar \
              --title "API Sentinel ${GITHUB_REF_NAME}" \
              --notes-file notes.md
          fi
