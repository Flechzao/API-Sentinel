# Deliberately insecure defaults — this app exists to be attacked by API
# Sentinel during benchmarking. Never deploy anywhere reachable from the
# internet.
server.port=8089
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always
spring.datasource.url=jdbc:h2:mem:vulnapp;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
logging.level.root=WARN

# Disable Freemarker view resolution (we use it programmatically for SSTI demo only)
spring.freemarker.enabled=false

# Explicit static resource config for Spring Boot 3.2+ (serves SPA from /static/)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
